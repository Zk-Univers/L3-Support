<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L3 Support Knowledge Base</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          <line x1="8" y1="7" x2="16" y2="7"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
        <div>
          <h1 data-i18n="title">L3 Support Knowledge Base</h1>
          <p class="subtitle" data-i18n="subtitle">Search through support documents to find solutions</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="cn">中文</button>
          <button class="lang-btn" data-lang="jp">JP</button>
        </div>
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="search-section">
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          data-i18n-placeholder="searchPlaceholder"
          placeholder="Ask a question or search for a topic..."
          autocomplete="off"
        />
        <button id="searchBtn" data-i18n="searchButton">Search</button>
      </div>
    </section>

    <section id="welcomeSection" class="welcome-section">
      <div class="welcome-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>
      <h2 data-i18n="welcomeTitle">How can we help you?</h2>
      <p data-i18n="welcomeHint">Type your question above to search the knowledge base</p>
    </section>

    <section id="loadingSection" class="loading-section hidden">
      <div class="spinner"></div>
      <p data-i18n="loading">Searching...</p>
    </section>

    <section id="resultsSection" class="results-section hidden">
      <div class="results-header">
        <h2 data-i18n="resultsTitle">Results</h2>
        <span id="resultCount" class="result-count"></span>
      </div>
      <div id="resultsList" class="results-list"></div>
    </section>

    <section id="relatedSection" class="related-section hidden">
      <h3 data-i18n="relatedTitle">Related Files</h3>
      <div id="relatedList" class="related-list"></div>
    </section>

    <section id="noResultsSection" class="no-results-section hidden">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
      <p data-i18n="noResults">No results found. Try different keywords.</p>
    </section>
  </main>

  <footer>
    <div class="footer-content">
      <span id="statsInfo"></span>
      <span data-i18n="poweredBy">Powered by L3-Support Repository</span>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/search.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
